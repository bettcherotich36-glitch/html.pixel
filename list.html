<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
 <h1>Lists in HTML</h1>   
 <P>Two types that is ordered and unordered list</P>
 <h2>Ordered List</h2>
 <h1>List of artist</h1>
 <ol>
    <li>Nikita Kering</li>
    <li>Bien Ainame</li>
    <li>Mordecai Dex</li>
    <li>Bensouk</li>
</ol>
<h2>Unordered List</h2>
<h1>List of Songs</h1>
<ul>
    <li>Inauuma</li>
    <li>Uro Uro</li>
    <li>Paloma</li>
</ul>
</body>
</html>
